<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقتي الشخصية</title>
<style>
  /* ====== عدّل بياناتك من هنا فقط ====== */
  :root{
    --gold:#f5c451; --gold2:#ffdf8a; --bg1:#070b16; --bg2:#101a33;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14); --txt:#f2f5ff; --mut:#9aa6c4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:10px 8px;
    font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif; color:var(--txt);
    background:radial-gradient(circle at 20% 10%,#1b2b55 0%,transparent 45%),
               radial-gradient(circle at 85% 90%,#3a2a0a 0%,transparent 40%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow-x:hidden;
  }
  /* جزيئات خلفية */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg i{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;
    background:var(--gold);opacity:.0;animation:rise linear infinite;filter:blur(.5px)}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}

  @property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
  .wrap{position:relative;z-index:1;width:100%;max-width:400px;transition:transform .15s ease-out;will-change:transform}
  /* إطار نيون يدور حول البطاقة */
  .wrap::before,.wrap::after{
    content:"";position:absolute;inset:-2px;border-radius:30px;padding:2px;pointer-events:none;z-index:3;
    background:conic-gradient(from var(--a),transparent 0%,var(--gold) 12%,transparent 28%,#3b82f6 50%,transparent 66%,var(--gold2) 84%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:spin 4s linear infinite;
  }
  .wrap::after{filter:blur(10px);opacity:.8;inset:-4px;padding:4px;border-radius:32px}
  @keyframes spin{to{--a:360deg}}
  .card{
    position:relative; padding:30px 22px 24px; border-radius:28px;
    background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15);
    animation:cardIn .9s cubic-bezier(.2,.9,.3,1.1) both;
    overflow:hidden;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(.94)}to{opacity:1;transform:none}}
  /* لمعة تمر على البطاقة */
  .card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);
    transform:skewX(-20deg);animation:shine 5s ease-in-out 1.2s infinite;pointer-events:none}
  @keyframes shine{0%{left:-60%}35%,100%{left:140%}}

  .avatar{
    width:112px;height:112px;margin:0 auto 14px;border-radius:50%;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#1a1200;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    box-shadow:0 10px 30px rgba(245,196,81,.4);
    animation:pop .8s .3s cubic-bezier(.2,1.4,.4,1) both, float 4s ease-in-out 1.2s infinite;
  }
  .avatar::before,.avatar::after{content:"";position:absolute;inset:-8px;border-radius:50%;
    border:2px solid var(--gold);opacity:.5;animation:pulse 2.4s ease-out infinite}
  .avatar::after{animation-delay:1.2s}
  @keyframes pulse{0%{transform:scale(.95);opacity:.6}100%{transform:scale(1.35);opacity:0}}
  @keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  h1{text-align:center;font-size:27px;font-weight:800;
    background:linear-gradient(90deg,#fff,var(--gold2),#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:fade .7s .5s both, grad 4s linear infinite, glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(245,196,81,.2))}50%{filter:drop-shadow(0 0 16px rgba(245,196,81,.7))}}
  @keyframes grad{to{background-position:200% center}}
  .role{text-align:center;color:var(--mut);font-size:14px;margin-top:6px;animation:fade .7s .65s both}
  .tag{display:block;width:max-content;margin:12px auto 0;padding:5px 14px;border-radius:99px;font-size:12px;
    color:var(--gold2);border:1px solid rgba(245,196,81,.4);background:rgba(245,196,81,.08);animation:fade .7s .8s both}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .sec{margin-top:22px;font-size:12px;color:var(--mut);letter-spacing:.5px;display:flex;align-items:center;gap:10px;
    animation:fade .7s .95s both}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}

  .phone{margin-top:10px;text-align:center;font-size:24px;font-weight:700;letter-spacing:2px;direction:ltr;
    animation:fade .7s 1s both}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:16px;
    text-decoration:none;color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer;font-family:inherit;
    transition:transform .2s, box-shadow .2s; animation:fade .7s 1.1s both; position:relative;overflow:hidden
  }
  .btn:active{transform:scale(.95)}
  .btn:hover{transform:translateY(-3px)}
  .call{background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 8px 22px rgba(59,130,246,.4)}
  .wa{background:linear-gradient(135deg,#25d366,#0e9f4b);box-shadow:0 8px 22px rgba(37,211,102,.4)}
  .btn svg{width:22px;height:22px;fill:#fff}
  .call svg{animation:ring 2s ease-in-out infinite;transform-origin:center}
  @keyframes ring{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(16deg)}85%{transform:rotate(-12deg)}95%{transform:rotate(8deg)}}

  .socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .soc{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;text-decoration:none;color:var(--txt);
    background:var(--glass);border:1px solid var(--line);transition:.25s;animation:fade .7s 1.25s both;min-width:0}
  .soc:hover{transform:translateY(-4px);border-color:var(--gold)}
  .soc .ic{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .soc svg{width:20px;height:20px;fill:#fff}
  .ig .ic{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}
  .tt .ic{background:linear-gradient(135deg,#111,#2b2b2b);box-shadow:inset 0 0 0 1px #25f4ee55,2px 2px 0 #fe2c5566}
  .soc b{display:block;font-size:14px}
  .soc small{display:block;color:var(--mut);font-size:11px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .pay{margin-top:10px;display:flex;flex-direction:column;gap:10px}
  .acc{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:16px;cursor:pointer;
    background:linear-gradient(135deg,rgba(245,196,81,.14),rgba(245,196,81,.03));border:1px solid rgba(245,196,81,.35);
    transition:.25s;animation:fade .7s 1.4s both;text-align:right;font-family:inherit;color:var(--txt);width:100%
  }
  .acc:nth-child(2){animation-delay:1.5s}
  .acc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(245,196,81,.18)}
  .acc .l{display:flex;align-items:center;gap:12px}
  .chip{width:42px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--gold2),#b88a1d);position:relative;flex:none}
  .chip::before{content:"";position:absolute;inset:6px 8px;border:1px solid rgba(0,0,0,.35);border-radius:3px}
  .acc b{display:block;font-size:14px}
  .acc .num{display:block;margin-top:3px;font-size:16px;letter-spacing:1.5px;direction:ltr;text-align:right;color:var(--gold2);font-variant-numeric:tabular-nums}
  .copy{flex:none;font-size:12px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
  .acc.done .copy{background:#22c55e;border-color:#22c55e;color:#04210f}

  .foot{margin-top:20px;text-align:center;font-size:11px;color:var(--mut);animation:fade .7s 1.7s both}

  /* كرات ضوئية عائمة */
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:0}
  .o1{width:300px;height:300px;background:#3b82f6;top:-80px;right:-80px;animation:drift1 14s ease-in-out infinite alternate}
  .o2{width:260px;height:260px;background:#f5c451;bottom:-60px;left:-70px;animation:drift2 17s ease-in-out infinite alternate}
  .o3{width:200px;height:200px;background:#e1306c;top:45%;left:55%;opacity:.2;animation:drift1 20s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(-90px,120px) scale(1.25)}}
  @keyframes drift2{to{transform:translate(110px,-100px) scale(1.2)}}

  /* خاتم متقطع يدور حول الصورة */
  .avatar .ring{position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(245,196,81,.6);animation:rot 12s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* تموّج عند الضغط */
  .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
  @keyframes ripple{to{transform:scale(1);opacity:0}}

  /* شرارات المؤشر والنسخ */
  .sp{position:fixed;width:8px;height:8px;pointer-events:none;z-index:99;border-radius:50%;
    animation:spark .8s ease-out forwards;box-shadow:0 0 10px currentColor;background:currentColor}
  @keyframes spark{to{transform:translate(var(--dx,0),var(--dy,-40px)) scale(0);opacity:0}}

  .tg{grid-column:1/-1;animation-delay:1.35s}
  .tg .ic{background:linear-gradient(135deg,#2aabee,#1d7fc4);box-shadow:0 0 14px rgba(42,171,238,.5)}

  .ctitle{width:max-content;margin:0 auto 14px;padding:8px 22px;border-radius:99px;font-size:16px;font-weight:700;
    color:var(--gold2);border:1px solid rgba(245,196,81,.45);background:rgba(245,196,81,.09);
    box-shadow:0 0 18px rgba(245,196,81,.25);animation:pop .8s .3s cubic-bezier(.2,1.4,.4,1) both, float 4s ease-in-out 1.2s infinite}

  /* حركات إضافية للعناصر */
  .soc:hover .ic{animation:wiggle .5s}
  @keyframes wiggle{25%{transform:rotate(-14deg) scale(1.1)}75%{transform:rotate(14deg) scale(1.1)}}
  .chip{overflow:hidden}
  .chip::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:chipShine 3s ease-in-out infinite}
  @keyframes chipShine{0%{left:-100%}50%,100%{left:160%}}
  .btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:chipShine 3.5s ease-in-out infinite}
  .wa{animation:fade .7s 1.1s both, bump 2.4s ease-in-out 2s infinite}
  @keyframes bump{0%,100%{box-shadow:0 8px 22px rgba(37,211,102,.4)}50%{box-shadow:0 8px 34px rgba(37,211,102,.85)}}

  @media (prefers-reduced-motion:reduce){*,*::after,*::before{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div class="wrap">

<script>
  // جزيئات الخلفية
  const bg=document.getElementById('bg');
  for(let i=0;i<26;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(7+Math.random()*9)+'s';
    p.style.animationDelay=(-Math.random()*12)+'s';
    p.style.width=p.style.height=(3+Math.random()*5)+'px';
    bg.appendChild(p);
  }

  // ميلان ثلاثي الأبعاد مع الماوس / اللمس
  const card=document.querySelector('.wrap');
  function tilt(x,y){
    const r=card.getBoundingClientRect();
    const dx=(x-(r.left+r.width/2))/r.width, dy=(y-(r.top+r.height/2))/r.height;
    card.style.transform=`perspective(900px) rotateY(${dx*12}deg) rotateX(${-dy*12}deg)`;
  }
  window.addEventListener('mousemove',e=>tilt(e.clientX,e.clientY));
  window.addEventListener('touchmove',e=>{const t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
  window.addEventListener('mouseleave',()=>card.style.transform='');
  window.addEventListener('touchend',()=>card.style.transform='');

  // شرارات
  const COLORS=['#f5c451','#ffdf8a','#3b82f6','#25d366','#e1306c','#fff'];
  function spark(x,y,dx,dy){
    const s=document.createElement('span');s.className='sp';
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    s.style.setProperty('--dx',dx+'px');s.style.setProperty('--dy',dy+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),800);
  }
  function burst(x,y){
    for(let i=0;i<16;i++){
      const a=Math.PI*2*i/16, d=40+Math.random()*50;
      spark(x,y,Math.cos(a)*d,Math.sin(a)*d);
    }
  }
  let lastSp=0;
  window.addEventListener('pointermove',e=>{
    const n=Date.now(); if(n-lastSp<45) return; lastSp=n;
    spark(e.clientX,e.clientY,(Math.random()-.5)*40,20+Math.random()*30);
  });
  window.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));

  // تموّج الأزرار
  document.querySelectorAll('.btn').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height)*2;
      const d=document.createElement('span');d.className='rip';
      d.style.width=d.style.height=s+'px';
      d.style.left=(e.clientX-r.left-s/2)+'px';d.style.top=(e.clientY-r.top-s/2)+'px';
      b.appendChild(d);setTimeout(()=>d.remove(),600);
    });
  });

  // ضبط الحجم تلقائياً ليناسب طول الشاشة بدون تمرير
  const fitEl=document.querySelector('.wrap');
  function fit(){
    // يكبّر البطاقة لتملأ طول الشاشة (حتى 1.3 ضعف) ويصغّرها فقط إذا لزم
    const avail=window.innerHeight-24;
    let z=1;
    for(let i=0;i<4;i++){
      fitEl.style.zoom=z;
      const h=fitEl.getBoundingClientRect().height;
      z=Math.max(.6,Math.min(1.3,z*avail/h));
    }
    fitEl.style.zoom=z;
  }
  window.addEventListener('load',()=>{fit();setTimeout(fit,150)});
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',()=>setTimeout(fit,200));
  fit();

  // اتصال وواتساب فوري
  function go(url){
    try{ window.top.location.href=url; }catch(e){ window.location.href=url; }
  }
  document.getElementById('callBtn').addEventListener('click',e=>{
    e.preventDefault();
    go('tel:07709461409');
  });
  document.getElementById('waBtn').addEventListener('click',e=>{
    e.preventDefault();
    const web='https://wa.me/9647709461409';
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      go('whatsapp://send?phone=9647709461409');
      setTimeout(()=>{ if(!document.hidden) go(web); },1200);
    }else{
      go(web);
    }
  });

  // نسخ الأرقام
  document.querySelectorAll('.acc').forEach(b=>{
    b.addEventListener('click',async()=>{
      const v=b.dataset.copy, lbl=b.querySelector('.copy');
      try{ await navigator.clipboard.writeText(v); }
      catch(e){
        const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();
        document.execCommand('copy');t.remove();
      }
      b.classList.add('done'); lbl.textContent='تم النسخ ✓';
      setTimeout(()=>{b.classList.remove('done');lbl.textContent='نسخ'},1800);
    });
  });
</script>
